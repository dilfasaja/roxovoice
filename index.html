<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROXO VOICE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101322;color:white;
 font-family:Arial,sans-serif;text-align:center;
 padding:20px 14px
}
.container{
 max-width:450px;margin:15px auto;
 background:#20263b;padding:22px;
 border-radius:20px
}
h1{color:#57d6ff}
input{
 width:100%;padding:14px;margin:7px 0;
 border-radius:10px;border:1px solid #555;
 background:#111;color:white;font-size:16px
}
button{
 padding:13px;border:0;border-radius:10px;
 font-size:15px;font-weight:bold;cursor:pointer
}
.main{width:100%;margin-top:10px;background:#16b98a;color:white}
.red{width:100%;margin-top:10px;background:#e44860;color:white}
.purple{background:#8955ed;color:white;width:100%;margin-top:12px}
#status{padding:12px;margin-top:15px;color:#8de8b1}
.room{
 background:#20263b;border-radius:20px;
 padding:22px;margin:20px auto;max-width:450px
}
.seats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:12px;margin:25px 0
}
.seat{
 background:#343953;border:2px solid #555b78;
 color:white;min-height:105px;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 gap:7px
}
.seat span{font-size:30px}
.seat small{font-size:12px;color:#c5c8df}
.seat.selected{border-color:#a47aff;background:#49366c}
.seat.owner{border-color:#e8bd51}
</style>
</head>
<body>

<div class="container">
<h1>🎙️ ROXO VOICE</h1>
<p>Tempat berkumpul dan ngobrol</p>
<input id="username" placeholder="Masukkan nama kamu">
<input id="roomname" placeholder="Masukkan nama room">
<button class="main" onclick="joinRoom()">MASUK ROOM</button>
<button class="red" onclick="leaveRoom()">KELUAR ROOM</button>
<div id="status">Belum masuk room</div>
</div>

<div class="room">
<h2>🎧 RUANG SUARA</h2>
<p id="roomTitle">Belum ada room</p>

<div class="seats" id="seats">
<button class="seat owner" onclick="sit(0)">
<span>👑</span><b>Pemilik</b><small>Kosong</small>
</button>
<button class="seat" onclick="sit(1)">
<span>🎤</span><b>Kursi 2</b><small>Kosong</small>
</button>
<button class="seat" onclick="sit(2)">
<span>🎤</span><b>Kursi 3</b><small>Kosong</small>
</button>
<button class="seat" onclick="sit(3)">
<span>🎤</span><b>Kursi 4</b><small>Kosong</small>
</button>
<button class="seat" onclick="sit(4)">
<span>🎤</span><b>Kursi 5</b><small>Kosong</small>
</button>
<button class="seat" onclick="sit(5)">
<span>🎤</span><b>Kursi 6</b><small>Kosong</small>
</button>
</div>

<p id="seatStatus">Silakan masuk room terlebih dahulu</p>
<button class="purple" id="micBtn" onclick="toggleMic()" disabled>🎙️ AKTIFKAN MIC</button>
<p id="micStatus">Mikrofon belum aktif</p>
</div>

<script>
let joined=false;
let selectedSeat=-1;
let stream=null;
let micOn=false;

const statusBox=document.getElementById("status");
const micBtn=document.getElementById("micBtn");

function joinRoom(){
 const name=document.getElementById("username").value.trim();
 const room=document.getElementById("roomname").value.trim();

 if(!name||!room){
  statusBox.textContent="Isi nama dan nama room dahulu!";
  return;
 }
 joined=true;
 document.getElementById("roomTitle").textContent="Room: "+room;
 statusBox.textContent="Berhasil masuk room! Selamat datang "+name;
 document.getElementById("seatStatus").textContent="Pilih tempat duduk mikrofon";
 micBtn.disabled=false;
}

function sit(number){
 if(!joined){
  alert("Masuk room terlebih dahulu!");
  return;
 }
 selectedSeat=number;
 const buttons=document.querySelectorAll(".seat");
 buttons.forEach((button,i)=>{
  button.classList.toggle("selected",i===number);
  const label=button.querySelector("small");
  label.textContent=i===number?"Kamu duduk di sini":"Kosong";
 });
 document.getElementById("seatStatus").textContent=
 "Kamu memilih "+(number===0?"kursi pemilik":"kursi "+(number+1));
}

async function toggleMic(){
 if(!joined)return;
 if(selectedSeat===-1){
  alert("Pilih kursi mikrofon terlebih dahulu!");
  return;
 }
 if(micOn){
  stream.getTracks().forEach(track=>track.stop());
  stream=null;
  micOn=false;
  micBtn.textContent="🎙️ AKTIFKAN MIC";
  document.getElementById("micStatus").textContent="Mikrofon belum aktif";
  return;
 }
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  micOn=true;
  micBtn.textContent="🔇 MATIKAN MIC";
  document.getElementById("micStatus").textContent="Mikrofon aktif di perangkat ini";
 }catch(error){
  document.getElementById("micStatus").textContent="Izin mikrofon belum diberikan";
 }
}

function leaveRoom(){
 if(stream)stream.getTracks().forEach(track=>track.stop());
 stream=null;micOn=false;joined=false;selectedSeat=-1;
 micBtn.disabled=true;
 micBtn.textContent="🎙️ AKTIFKAN MIC";
 document.getElementById("micStatus").textContent="Mikrofon belum aktif";
 document.getElementById("roomTitle").textContent="Belum ada room";
 document.getElementById("seatStatus").textContent="Silakan masuk room terlebih dahulu";
 document.querySelectorAll(".seat").forEach((button,i)=>{
  button.classList.remove("selected");
  button.querySelector("small").textContent="Kosong";
 });
 statusBox.textContent="Kamu sudah keluar dari room";
}
</script>
</body>
</html>
