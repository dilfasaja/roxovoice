<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROXO VOICE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px 16px;
      background: #101322;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 430px;
      margin: 30px auto;
      padding: 25px 20px;
      background: #20263b;
      border-radius: 18px;
      box-shadow: 0 8px 25px #0005;
    }
    h1 { color: #57d6ff; margin-bottom: 8px; }
    p { color: #c6cce0; }
    input {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border: 1px solid #59617e;
      border-radius: 10px;
      background: #11182a;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #16b9e8;
      color: #071522;
    }
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .red { background: #ed5366; color: white; }
    .yellow { background: #ffc94a; color: #222; }
    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #11182a;
      color: #80e6a4;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ ROXO VOICE</h1>
    <p>Tempat berkumpul dan ngobrol</p>

    <input id="username" placeholder="Masukkan nama kamu">
    <input id="roomname" placeholder="Masukkan nama room">

    <button id="joinBtn" onclick="joinRoom()">MASUK ROOM</button>
    <button class="red" id="leaveBtn" onclick="leaveRoom()" disabled>KELUAR ROOM</button>

    <div id="status">Belum masuk room</div>

    <button id="micBtn" onclick="toggleMic()" disabled>
      AKTIFKAN MIC
    </button>

    <button class="yellow" id="handBtn" onclick="raiseHand()" disabled>
      ✋ ANGKAT TANGAN
    </button>
  </div>

  <script>
    let inRoom = false;
    let micStream = null;
    let micOn = false;
    let handRaised = false;

    const statusBox = document.getElementById("status");
    const joinBtn = document.getElementById("joinBtn");
    const leaveBtn = document.getElementById("leaveBtn");
    const micBtn = document.getElementById("micBtn");
    const handBtn = document.getElementById("handBtn");

    function showStatus(message) {
      statusBox.textContent = message;
    }

    function joinRoom() {
      const username = document.getElementById("username").value.trim();
      const roomname = document.getElementById("roomname").value.trim();

      if (!username || !roomname) {
        showStatus("Isi nama dan nama room terlebih dahulu!");
        return;
      }

      inRoom = true;
      joinBtn.disabled = true;
      leaveBtn.disabled = false;
      micBtn.disabled = false;
      handBtn.disabled = false;

      showStatus("Berhasil masuk room: " + roomname +
        "\nSelamat datang, " + username + "!");
    }

    async function toggleMic() {
      if (!inRoom) return;

      if (micOn) {
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
        micOn = false;
        micBtn.textContent = "AKTIFKAN MIC";
        showStatus("Mikrofon dimatikan.");
        return;
      }

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });
        micOn = true;
        micBtn.textContent = "MATIKAN MIC";
        showStatus("Mikrofon aktif di perangkat ini.");
      } catch (error) {
        showStatus("Mikrofon tidak bisa diaktifkan. Periksa izin mikrofon browser.");
      }
    }

    function raiseHand() {
      if (!inRoom) return;

      handRaised = !handRaised;
      handBtn.textContent = handRaised
        ? "✋ TURUNKAN TANGAN"
        : "✋ ANGKAT TANGAN";

      showStatus(handRaised
        ? "Kamu sedang mengangkat tangan."
        : "Tangan sudah diturunkan.");
    }

    function leaveRoom() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      inRoom = false;
      micOn = false;
      handRaised = false;

      joinBtn.disabled = false;
      leaveBtn.disabled = true;
      micBtn.disabled = true;
      handBtn.disabled = true;

      micBtn.textContent = "AKTIFKAN MIC";
      handBtn.textContent = "✋ ANGKAT TANGAN";

      showStatus("Kamu sudah keluar dari room.");
    }
  </script>
</body>
</html>
